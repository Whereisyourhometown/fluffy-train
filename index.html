<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>加载中...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#000;
    color:#fff;
    text-align:center;
    font-family:Arial;
  }
  #ghost{
    width:100vw;
    height:100vh;
    object-fit:cover;
    display:none;
    position:fixed;
    top:0;left:0;
    z-index:9999;
  }
  #tip{
    margin-top:40vh;
    font-size:24px;
  }
</style>
</head>
<body>
<h1 id="tip">正在加载资源...(老家在哪里极速加载)</h1>

<!-- 你的图片：恐怖.jpg -->
<img id="ghost" src="恐怖.jpg">

<!-- 你的音频：女鬼.mp3 -->
<audio id="scaryAudio" src="女鬼.mp3">

<script>
let audio = document.getElementById("scaryAudio");
let ghost = document.getElementById("ghost");
let tip = document.getElementById("tip");

// 关键：到27秒就切回0秒循环
audio.addEventListener("timeupdate", function(){
  if (audio.currentTime >= 27) {
    audio.currentTime = 0;
    audio.play();
  }
});

// 点屏幕触发：全屏 + 显示图片 + 播放声音
document.body.addEventListener('click', function(){
  document.documentElement.requestFullscreen();

  setTimeout(()=>{
    tip.style.display = "none";
    ghost.style.display = "block";
    audio.volume = 1;
    audio.currentTime = 0;
    audio.play();
  }, 1500);
});
</script>
</body>
</html>
